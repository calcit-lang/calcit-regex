on:
  push:
    branches:
      - master
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"

      - name: Validate Calcit snapshot and types
        run: |
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --warn-dyn-method --check-only
          calcit calcit.cirru --check-only --all-defs
          calcit calcit.cirru fix --workflow strict --verify --format json
          calcit calcit.cirru --check-only --ns regex.core --ns regex.test --ns regex.util --summary-only --format edn
          calcit calcit.cirru analyze weak-types --only coverage --summary-only --format edn
          calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format edn

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo test --locked

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo build --release --locked

      - run: mkdir -p dylibs/ && ls target/release/ && cp -v target/release/*.* dylibs/

      - name: Validate Calcit behavior and documentation
        run: |
          calcit calcit.cirru analyze check-examples --ns regex.core
          calcit calcit.cirru test --require-match
          calcit calcit.cirru docs format-md README.md --check
          calcit calcit.cirru docs format-md docs/compiled-patterns.md --check
          calcit calcit.cirru docs check-md README.md --failures-only
          calcit calcit.cirru docs check-md docs/compiled-patterns.md --failures-only
          calcit --trace-ffi calcit.cirru
